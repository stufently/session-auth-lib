name: Publish to PyPI

# Auto-publishes tdata-session-exporter to PyPI when a tag matching `v*` is
# pushed. Uses PyPI Trusted Publishing (OIDC) — no long-lived API token in the
# repo.
#
# Setup (one-time, in PyPI web UI):
#   https://pypi.org/manage/account/publishing/
#   → Add a pending publisher:
#       PyPI Project Name:  tdata-session-exporter
#       Owner:              stufently
#       Repository name:    session-auth-lib
#       Workflow filename:  publish.yml
#       Environment name:   pypi
#       (the GitHub environment "pypi" must allow deployments from tags:
#        "Allow all branches and tags" or a "v*" tag pattern — a main-only
#        deployment branch policy would reject runs on tag refs)
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  # Dispatched by autotag.yml with --ref v<version>: a tag created with the
  # workflow's GITHUB_TOKEN does not fire the `push: tags` trigger itself.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test before publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package
        run: |
          pip install --upgrade pip
          pip install .

      # No test suite in this repo yet — smoke-test that the installed package
      # imports cleanly with its PyPI dependencies (opentele-ng, telethon, …).
      - name: Smoke import
        run: |
          python -c "from tdata_session_exporter import MyTelegramClient, authorize_client; import tdata_session_exporter.auth; print('smoke import OK')"

  build:
    name: Build sdist + wheel
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build deps
        run: python -m pip install --upgrade pip build twine

      - name: Verify tag matches pyproject version
        run: |
          # Publish only ever runs from a tag ref — a workflow_dispatch on a
          # branch (even one named like v1.2.3) must not reach PyPI.
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
              echo "ERROR: ref '$GITHUB_REF_NAME' is a $GITHUB_REF_TYPE, not a tag — refusing to publish" >&2
              exit 1
          fi
          PY_VERSION=$(python -c "import tomllib,sys; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          # Strict: the tag must be exactly v<pyproject version> — no suffix
          # stripping, so v1.2.3-anything cannot publish 1.2.3 (Codex review).
          echo "pyproject: $PY_VERSION   tag: $GITHUB_REF_NAME"
          if [ "$GITHUB_REF_NAME" != "v$PY_VERSION" ]; then
              echo "ERROR: tag ($GITHUB_REF_NAME) does not match pyproject version (v$PY_VERSION)" >&2
              exit 1
          fi

      - name: Build
        run: python -m build

      - name: twine check
        run: python -m twine check dist/*

      - name: Show artifacts
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Upload to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/tdata-session-exporter/
    permissions:
      id-token: write   # OIDC
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Pinned by commit SHA, not by the floating `release/v1` branch: this step
      # holds the OIDC token that can upload to PyPI, so a compromised upstream
      # branch would publish arbitrary code under our project name. Bump
      # deliberately: check upstream release notes, then update SHA + comment.
      - name: Publish (with PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          attestations: true
